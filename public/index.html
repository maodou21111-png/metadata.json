<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>足球弹射小游戏</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <main class="game">
    <header class="top-card">
      <div class="medal">🥇</div>
      <div class="hud">
        <h1 id="coinText">$0</h1>
        <div class="distance-row">
          <span>本次 <b id="currentDistance">0</b>m</span>
          <span>最佳 <b id="bestDistance">0</b>m</span>
        </div>
        <div class="progress-track">
          <div id="progressBar" class="progress-bar"></div>
        </div>
        <small id="levelText">Level 1</small>
      </div>
    </header>

    <section class="btn-row">
      <button class="menu-btn yellow">排行榜</button>
      <button class="menu-btn pink">皮肤</button>
    </section>

    <section class="field" id="kickArea">
      <div class="goal">🥅</div>
      <div class="player">🧍‍♂️</div>
      <div id="ball" class="ball">⚽</div>
      <button id="kickBtn" class="kick-btn">点击射门</button>
      <div id="toast" class="toast hidden">获得0金币</div>
    </section>

    <section class="upgrade-bar">
      <button id="powerBtn" class="upgrade red">
        <span>力量 Lv.<b id="powerLv">1</b></span>
        <small>¥<span id="powerCost">120</span></small>
      </button>
      <button id="bounceBtn" class="upgrade blue">
        <span>弹力 Lv.<b id="bounceLv">1</b></span>
        <small>¥<span id="bounceCost">180</span></small>
      </button>
      <button id="offlineBtn" class="upgrade yellow2">
        <span>离线 Lv.<b id="offlineLv">1</b></span>
        <small>¥<span id="offlineCost">240</span></small>
      </button>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
